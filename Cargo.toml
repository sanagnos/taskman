[package]
name = "taskman-app"
version = "0.1.21"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A terminal UI for working on several tickets at once, each with its own Claude Code or Codex session"
repository = "https://github.com/sanagnos/taskman"
homepage = "https://github.com/sanagnos/taskman"
readme = "README.md"
keywords = ["tui", "claude", "jira", "linear", "worktree"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-*"]

# cargo-binstall installs from the release archives: taskman-vX.Y.Z-<target>.tar.gz holding just
# the binary. Their names must stay stable anyway, as installed copies update from them.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/taskman-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[[bin]]
name = "taskman"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
crossterm = "0.29"
filedescriptor = "0.8.3"
libc = "0.2.190"
portable-pty = "0.9"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
signal-hook = "0.4.5"
# Without its vt100 feature, which ties vt100 to the version tui-term asks for: src/term.rs
# implements its traits.
tui-term = { version = "0.3", default-features = false }
# The graphemes ratatui draws text in, so text is cut where ratatui would: src/util.rs.
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", features = ["json"] }
vt100 = "0.18"

[lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
unchecked_time_subtraction = "warn"
redundant_closure = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
undocumented_unsafe_blocks = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
cast_precision_loss = "warn"
checked_conversions = "warn"
invalid_upcast_comparisons = "warn"
return_self_not_must_use = "warn"
match_wildcard_for_single_variants = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# unwrap_used, expect_used and panic are set in src/main.rs instead, to leave tests/ out.

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# vt100 0.18 with OSC 8 hyperlinks kept per cell, erased cells keeping only the background colour
# and scrollback rows copied, trimmed, into allocations of their own (upstream's own trimming
# leaves the memory in use). Upstream has no OSC 8 support, so expect the fork to stay. It's also
# why taskman isn't on crates.io: a published crate can't depend on a git fork.
[patch.crates-io]
vt100 = { git = "https://github.com/sanagnos/vt100-rust", rev = "59353902703fbeca7514a21db53748c8f32e0688" }

# What the release workflow builds (--profile dist): a fifth smaller than a release build, for a
# build nearly twice as long, so it's a profile of its own and `cargo build --release` stays quick.
# Symbols are kept: stripped, a backtrace in panics.log names no functions. `panic` must stay
# "unwind": a session's reader thread survives a panic in the terminal parser (session.rs).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[dev-dependencies]
insta = { version = "1.49.0", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
