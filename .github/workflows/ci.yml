# Formatting, lints, tests and a coverage report on every pull request and every push to main,
# and every week the tests again and a dependency check, so a new runner image or toolchain and
# new security advisories show up without a pull request. It can be started by hand too, for when
# GitHub drops a push event or a run never ends: `gh workflow run ci.yml --ref main`.
# The release gates (scripts/release.sh, release.yml's ci job) read the conclusion of a run on
# main for the commit, pushed or started by hand: a job that's only a report mustn't fail it.
# Actions are pinned by commit; Dependabot proposes updates (.github/dependabot.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces its run. Anything else is grouped by commit, so each
  # commit on main keeps a run of its own that finishes: a release tagged right after a merge used
  # to cancel the merge commit's run, and a group per branch still cancels a run waiting in it when
  # a third push comes.
  group: >-
    ci-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    # Under two minutes with a warm cache; a cold one and a slow macOS runner take far longer.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust in rust-toolchain.toml, which the release builds use too.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      # The ci profile in .config/nextest.toml: a timeout per test, one rerun for the tests in
      # tests/, flaky ones reported. The crate is a binary only, so there are no doctests, which
      # nextest wouldn't run.
      - run: cargo nextest run --locked --profile ci
      # The failed and flaky tests in the run's summary, and a warning on the pull request for
      # each test that passed only on its rerun.
      - name: Report
        if: ${{ !cancelled() && hashFiles('target/nextest/ci/junit.xml') != '' }}
        env:
          OS: ${{ matrix.os }}
        run: |
          python3 -I - target/nextest/ci/junit.xml <<'EOF'
          import os, sys, xml.etree.ElementTree as ET

          run = ET.parse(sys.argv[1]).getroot()
          failed, flaky = [], []
          for case in run.iter("testcase"):
              name = f"{case.get('classname').split('::', 1)[-1]} {case.get('name')}"
              # A rerun keeps the first attempt's failure as <flakyFailure>; a test that failed
              # in the end (or passed on the rerun where that counts as failing) has <failure>.
              first = case.find("flakyFailure")
              last = next((e for e in case if e.tag in ("failure", "error")), None)
              if last is not None:
                  failed.append((name, (last if first is None else first).get("message")))
              elif first is not None:
                  flaky.append((name, first.get("message")))
                  print(f"::warning title=Flaky test::{name} failed, then passed on its rerun")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### Tests on {os.environ['OS']}: {run.get('tests')} run, "
                        f"{len(failed)} failed, {len(flaky)} flaky\n")
              for title, cases in (("Failed", failed), ("Failed, then passed on the rerun", flaky)):
                  if cases:
                      out.write(f"\n{title}:\n\n")
                      out.writelines(f"- `{n}`: {m}\n" for n, m in cases)
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      # The install script and `taskman update` against fake releases on a local server.
      - run: cargo build --locked && scripts/test-install.sh
      # The release script against a local origin, with gh and cargo faked.
      - run: scripts/test-release.sh

  # How much of the code the tests run, in the run's summary and as a notice on the pull request.
  # A report, not a gate: its failure leaves the run green, as cargo test has no rerun for a flaky
  # test the way nextest's ci profile has. Linux only, as macOS minutes are billed. With cargo test
  # rather than nextest: a process per test would write a profile per test, and contributors run
  # the script without nextest.
  coverage:
    if: github.event_name != 'schedule'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      # The tests and scripts/test-install.sh, whose `taskman update` runs outside cargo test.
      - run: scripts/coverage.sh
      - name: Report
        run: |
          jq -r --arg root "$GITHUB_WORKSPACE/" '
            def pct: (.percent * 10 | round / 10 | tostring) + "%";
            .data[0] as $d
            | "### Coverage: \($d.totals.lines | pct) of lines",
              "",
              "Functions \($d.totals.functions | pct), regions \($d.totals.regions | pct). Unit tests in src/ count as lines run, and so do the binary tests and scripts/test-install.sh. A report, not a gate.",
              "",
              "| File | Lines | Covered |",
              "|---|---:|---:|",
              ($d.files | sort_by(.filename)[]
                | "| \(.filename | ltrimstr($root)) | \(.summary.lines.count) | \(.summary.lines | pct) |")
          ' coverage.json >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Coverage::$(jq -r '.data[0].totals.lines.percent * 10 | round / 10' coverage.json)% of lines (details in the run's summary)"

  # The oldest Rust taskman supports (rust-version in Cargo.toml), over rust-toolchain.toml's.
  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets --locked

  # Advisories, bans (no wildcard versions; duplicates only warn), licenses and sources
  # (deny.toml), and the third-party notices (about.toml). The prebuilt binaries rather than
  # cargo-deny-action: that one pulls a Docker Hub image, and anonymous pulls from shared runner
  # IPs hit Docker Hub's rate limit. The job name is a required check on main; keep it.
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          # cargo-about's version is the release workflow's; a different one may word the file
          # differently.
          tool: cargo-deny,cargo-about@0.9.2
      - run: cargo deny --locked check advisories bans licenses sources
      # LICENSE-THIRD-PARTY, which the archives and `taskman --licenses` carry, must match the
      # lockfile: the file as cargo-about would write it now has to be the one committed.
      - name: Check the third-party notices are current
        run: |
          cargo about generate --locked --fail about.hbs -o notices.txt
          if ! diff LICENSE-THIRD-PARTY notices.txt; then
            echo "LICENSE-THIRD-PARTY is out of date: run the cargo about command in about.toml and commit the result" >&2
            exit 1
          fi
