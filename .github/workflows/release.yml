# Builds taskman for each platform and publishes a GitHub Release with the binaries (each archive
# holding the binary and its license files), one SHA256SUMS, and the version's section of
# CHANGELOG.md as its notes. On a public repository it also attests where each file was built
# (`gh attestation verify`). Nothing is published unless CI passed on the tag's commit, every
# build that install.sh and `taskman update` can ask for has its archive, and each binary that can
# run on its runner said the tag's version.
#
# Runs when a version tag (v1.2.3) is pushed. It can also be started by hand for a tag without a
# release, to build one again after deleting it or after CI on its commit was re-run (or started
# by hand) and passed:
#   gh workflow run release.yml -f tag=v1.2.3
# A run for a tag that already has a published release builds nothing and ends green: that's the
# tag push GitHub delivered late, after the release script had started a run by hand.
# That runs this file as it is on main. A tag from before rust-toolchain.toml and the dist profile
# needs the workflow it was tagged with: add --ref v1.2.3.
#
# A dry run builds, runs and checks every binary and archive as a release would, from a branch's
# latest commit and for Cargo.toml's version, and keeps the archives and SHA256SUMS as the run's
# artifacts; it needs no tag, doesn't wait for CI, and skips the release job, so it publishes and
# attests nothing:
#   gh workflow run release.yml --ref my-branch -f dry_run=true
#
# The build jobs run every dependency's build script, so they get a read-only token that isn't
# kept in .git/config; only the release job, which runs no project code, can write or attest.
# Actions are pinned by commit; Dependabot proposes updates (.github/dependabot.yml).
name: Release
run-name: >-
  ${{ inputs.dry_run && format('Release dry run on {0}', github.ref_name)
  || format('Release {0}', inputs.tag || github.ref_name) }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and release, like v1.2.3 (none for a dry run)"
        required: false
      dry_run:
        description: "Build and check the branch's latest commit, and publish nothing"
        type: boolean
        default: false

permissions: {}

concurrency:
  # Dry runs are by commit, so one never waits on, or holds up, a release.
  group: >-
    release-${{ inputs.dry_run && format('dry-run-{0}', github.sha)
    || inputs.tag || github.ref_name }}
  cancel-in-progress: false
  # Runs for one tag wait their turn, all of them: with the default queue of one, a third run
  # would cancel the one waiting, leaving a red run on the release commit.
  queue: max

jobs:
  # What to build: the tag's commit, or in a dry run the commit it was started on. Checked here,
  # before a runner is taken for each build. Reads Cargo.toml through the API; runs no project code.
  # Each job after it has the tag as TAG: the one pushed or given when started by hand, or in a
  # dry run Cargo.toml's version as a tag, which names the archives and each binary must say.
  # `done` is true when the tag already has a published release, and the other jobs then skip.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      done: ${{ steps.version.outputs.done }}
    steps:
      - name: Name the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          GIVEN: ${{ inputs.tag }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            if [ -n "$GIVEN" ]; then
              echo "A dry run builds the commit it's started on: give --ref instead of a tag." >&2
              exit 1
            fi
            ref="$GITHUB_SHA"
            # The version line in [package] is the first one in Cargo.toml (as release.sh says).
            version="$(gh api "repos/$GITHUB_REPOSITORY/contents/Cargo.toml?ref=$ref" \
              -H 'Accept: application/vnd.github.raw' \
              | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)"
            tag="v$version"
            echo "Dry run of $tag at $ref ($GITHUB_REF_NAME): nothing is published."
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "$GIVEN" ]; then
            echo "Give the tag to release (-f tag=v1.2.3), or -f dry_run=true for a dry run." >&2
            exit 1
          else
            tag="${GIVEN:-$GITHUB_REF_NAME}"
            ref="refs/tags/$tag"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$tag isn't a version tag like v1.2.3" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # A release's runs queue one after another (concurrency above), so one that finds the
          # tag released came after the run that released it: a tag push GitHub delivered after
          # the release script had given up on it and started a run by hand. Skipped, not failed
          # or cancelled, so the release commit stays green. A draft is a failed run's, which
          # this one replaces. Only a published release has draft false; a missing one is a 404.
          if [ "$DRY_RUN" != true ] \
            && [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .draft 2>/dev/null)" = false ]; then
            echo "::notice title=Already released::$tag already has a published release, so this run builds nothing. To build it again, delete the release first (gh release delete $tag)."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

  # CI on main must have passed on the tag's commit. Releases are immutable and every install
  # updates to the new one within the hour, so a broken one can only be replaced by another
  # version; and an admin's push to main skips the required checks but still runs CI. The release
  # script pushes the release commit and its tag together, so CI on it is usually still running:
  # this waits for it. A run started by hand counts as well as a pushed one, for when GitHub drops
  # the push event or a run never ends. Runs no project code, alongside the builds. A dry run has
  # no tag: it looks once at CI on its own commit and branch, to show what a release would read,
  # and doesn't fail on it.
  ci:
    needs: version
    if: ${{ needs.version.outputs.done != 'true' }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    # CI's slowest job has 30 minutes, after waiting for a runner.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      # While GitHub has trouble its answers flap: a run it listed can be missing from the next
      # answer, so once a run has been seen, an empty answer or a failed gh is no news. A run can
      # also stay in progress for hours after its last job ended; one whose jobs have all passed,
      # and still hasn't ended ten minutes later, has passed. When the wait runs out, this job
      # fails, and running it again resumes the release with the builds already made:
      #   gh run rerun <this run> --failed
      - name: Wait for CI on the tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            sha="$GITHUB_SHA" branch="$GITHUB_REF_NAME"
          else
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)" branch=main
            echo "$TAG is $sha"
          fi
          rerun="carry on with this release: gh run rerun $GITHUB_RUN_ID --failed"
          start=$(date +%s)
          seen=""
          passed_at=""
          last=""
          while :; do
            # "id|status|conclusion|url" of a run on the branch, pushed or started by hand
            # ("null|null|null|null" when there's none): one that passed, else one still going,
            # else the latest. The conclusion is empty until it ends.
            run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" \
              --branch "$branch" --limit 10 --json databaseId,event,status,conclusion,url --jq '
                map(select(.event == "push" or .event == "workflow_dispatch"))
                | (map(select(.conclusion == "success")) + map(select(.status != "completed"))
                  + .)[0] // {}
                | "\(.databaseId)|\(.status)|\(.conclusion)|\(.url)"')" || run=""
            IFS='|' read -r id status conclusion url <<<"$run"
            now=$(date +%s)
            if [ "$DRY_RUN" = true ]; then
              case "$status" in
                "" | null) found="no run" ;;
                *) found="$status ${conclusion:+$conclusion }$url" ;;
              esac
              echo "CI on $branch at $sha, as a release would read it: $found"
              exit 0
            fi
            case "$status" in
              completed)
                if [ "$conclusion" = success ]; then
                  echo "CI passed on $sha: $url"
                  exit 0
                fi
                echo "CI on $sha ended $conclusion: $url" >&2
                echo "Fix main and release a new version, or re-run CI; once it has passed, $rerun" >&2
                exit 1
                ;;
              "" | null)
                if [ -z "$seen" ] && [ $((now - start)) -gt 600 ]; then
                  echo "No CI run on main for $sha. While it's main's latest commit, start one" \
                    "(gh workflow run ci.yml --ref main); once it has passed, $rerun" >&2
                  exit 1
                fi
                ;;
              *)
                seen="$url"
                passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                  --jq '.total_count > 0 and all(.jobs[]; .status == "completed"
                    and (.conclusion | IN("success", "skipped")))')" || passed=""
                if [ "$passed" = true ]; then
                  passed_at="${passed_at:-$now}"
                  if [ $((now - passed_at)) -ge 600 ]; then
                    echo "Every job of CI on $sha passed, though GitHub still says the run is $status: $url"
                    exit 0
                  fi
                else
                  passed_at=""
                fi
                ;;
            esac
            if [ $((now - start)) -gt 3000 ]; then
              echo "CI on $sha hasn't finished: ${seen:-no run}. Once it has passed, or a run" \
                "started by hand (gh workflow run ci.yml --ref main) has, $rerun" >&2
              exit 1
            fi
            if [ "${seen:-not started}" != "$last" ]; then
              last="${seen:-not started}"
              echo "Waiting for CI on $sha: $last"
            fi
            sleep 30
          done

  # The check and release jobs after it skip when it does, as needs skip jobs whose needs skipped.
  build:
    needs: version
    if: ${{ needs.version.outputs.done != 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          # Linux and WSL. The older Ubuntu keeps the glibc requirement low (install.sh's
          # glibc_min). Each build runs on its own architecture, so each binary is run below.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          # Static, for Alpine and a glibc older than glibc_min.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm }
    # No build is optional: a release is immutable, so one published without an archive could
    # never get it, and the machines install.sh and `taskman update` send to it would find none.
    # A failed build leaves no release; the others still finish (fail-fast is off) to show theirs.
    runs-on: ${{ matrix.os }}
    # A build takes about two minutes; generous, as a release waits on the slowest.
    timeout-minutes: 30
    env:
      TAG: ${{ needs.version.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false

      # The Rust in rust-toolchain.toml at the tag, which CI tested the commit with.
      - run: rustup toolchain install && rustup target add "$TARGET"

      # ring compiles C, which for musl needs musl's headers and libc: musl-gcc.
      - name: Install musl-gcc
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      # In a dry run the tag is Cargo.toml's version, so this checks only that cargo reads the same.
      - name: Check the tag matches Cargo.toml
        run: |
          version="v$(cargo pkgid | sed 's/.*[#@]//')"
          if [ "$version" != "$TAG" ]; then
            echo "Tag $TAG doesn't match Cargo.toml's $version" >&2
            exit 1
          fi

      # The dist profile (Cargo.toml): the release profile, optimised further. TASKMAN_RELEASE_BUILD
      # marks it a release: without it, it's a development build, which neither updates itself nor
      # lets taskman update or uninstall touch it.
      - run: cargo build --profile dist --locked --target "$TARGET"
        env:
          TASKMAN_RELEASE_BUILD: "1"

      # A binary that doesn't start, says another version or takes itself for a development
      # build must not reach the installs that update to it. The Intel macOS build runs on the Apple
      # Silicon runner through Rosetta; if the runner has no Rosetta, only that binary goes
      # unchecked.
      - name: Run the binary
        run: |
          bin="target/$TARGET/dist/taskman"
          if [ "$TARGET" = x86_64-apple-darwin ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::No Rosetta on this runner: $TARGET's binary was built but not run."
            exit 0
          fi
          version="$("$bin" --version)"
          if [ "$version" != "taskman ${TAG#v}" ]; then
            echo "$bin --version says \"$version\", not taskman ${TAG#v}" >&2
            exit 1
          fi
          echo "$version: the tag's version"
          "$bin" --licenses > licenses.txt
          head -1 licenses.txt
          if ! cmp -s licenses.txt LICENSE-THIRD-PARTY; then
            echo "$bin --licenses doesn't print LICENSE-THIRD-PARTY" >&2
            exit 1
          fi
          # A release that took itself for a development build would leave every install unable to
          # update, so a copy of it, in a scratch home, must remove itself as an install would.
          home="$(mktemp -d)"
          cp "$bin" "$home/taskman"
          env -u TASKMAN_CONFIG -u XDG_CONFIG_HOME -u XDG_STATE_HOME HOME="$home" "$home/taskman" uninstall --yes
          if [ -e "$home/taskman" ]; then
            echo "$bin takes itself for a development build: was TASKMAN_RELEASE_BUILD set for the build?" >&2
            exit 1
          fi
          echo "a copy of $bin removed itself: a release, not a development build"

      # install.sh picks the glibc build from glibc_min on and the musl build below it, so the
      # glibc build may ask for nothing newer, and the musl build, static, for no library at all.
      - name: Check the libraries it needs
        if: runner.os == 'Linux'
        run: |
          bin="target/$TARGET/dist/taskman"
          case "$TARGET" in
            *-gnu)
              min="$(sed -n 's/^ *glibc_min=//p' scripts/install.sh)"
              needs="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1)"
              if [ -z "$min" ] || [ -z "$needs" ] \
                || [ "$(printf '%s\n' "$min" "$needs" | sort -V | tail -1)" != "$min" ]; then
                echo "$bin needs glibc ${needs:-?}, newer than install.sh's glibc_min (${min:-unset})" >&2
                exit 1
              fi
              echo "$bin needs glibc $needs; install.sh picks it from glibc $min on"
              ;;
            *-musl)
              if readelf -d "$bin" | grep NEEDED; then
                echo "$bin needs the shared libraries above; a musl build must be static" >&2
                exit 1
              fi
              echo "$bin is static"
              ;;
          esac

      # LICENSE-THIRD-PARTY, the notices of the crates in the binary, goes in the archive and is
      # embedded in the binary, so it must be the committed file: generated again here from the
      # lockfile at the tag, with the cargo-about version CI checks it with, and compared.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      - name: Check the third-party notices are current
        run: |
          cargo about generate --locked --fail about.hbs -o notices.txt
          if ! diff LICENSE-THIRD-PARTY notices.txt; then
            echo "LICENSE-THIRD-PARTY is out of date at $TAG: regenerate it (see about.toml) and release again" >&2
            exit 1
          fi

      # The binary and its license files, flat, so the binary unpacks straight into a bin
      # directory: the install script and `taskman update` take only `taskman` out of the archive.
      - name: Package
        run: |
          cp LICENSE-MIT LICENSE-APACHE LICENSE-THIRD-PARTY "target/$TARGET/dist/"
          tar czf "taskman-$TAG-$TARGET.tar.gz" -C "target/$TARGET/dist" \
            taskman LICENSE-MIT LICENSE-APACHE LICENSE-THIRD-PARTY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: taskman-*.tar.gz
          if-no-files-found: error

  # The archives together, in a release and a dry run alike: one for each build install.sh can
  # pick (the unit test in update.rs keeps that list, `taskman update`'s and the build matrix the
  # same), each holding what it should, and SHA256SUMS for them. Runs no project code: install.sh
  # is read through the API.
  check:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      # A release is immutable, so an archive missing from it could never be added.
      - name: Check there's an archive for every build
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.version.outputs.ref }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/install.sh?ref=$REF" \
            -H 'Accept: application/vnd.github.raw' > install.sh
          targets="$(sed -n 's/.*) target=\([a-z0-9_-]*\) ;;.*/\1/p' install.sh)"
          if [ -z "$targets" ]; then
            echo "Found no builds in install.sh's target= lines." >&2
            exit 1
          fi
          want="$(for t in $targets; do echo "taskman-$TAG-$t.tar.gz"; done | sort -u)"
          shopt -s nullglob
          got="$(printf '%s\n' taskman-*.tar.gz | sort)"
          if [ "$got" != "$want" ]; then
            echo "The archives aren't one for each build install.sh picks." >&2
            echo "Missing: $(comm -23 <(echo "$want") <(echo "$got") | xargs)" >&2
            echo "Not picked by install.sh: $(comm -13 <(echo "$want") <(echo "$got") | xargs)" >&2
            exit 1
          fi
          echo "$want"

      # Every archive carries the binary and its license files; a release without the notices
      # would be missing what the licenses of the code in it ask for.
      - name: Check the archives
        run: |
          for archive in taskman-*.tar.gz; do
            for f in taskman LICENSE-MIT LICENSE-APACHE LICENSE-THIRD-PARTY; do
              if ! tar tzf "$archive" | grep -qx "$f"; then
                echo "$archive doesn't hold $f" >&2
                exit 1
              fi
            done
          done

      # One file for every archive: the install script and `taskman update` refuse a download
      # it doesn't list.
      - name: Checksums
        run: sha256sum taskman-*.tar.gz | tee SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: SHA256SUMS
          if-no-files-found: error

  # The only job that can write. Skipped in a dry run, for a tag already released, and whenever a
  # build, the check or CI failed: nothing is published, attested or drafted.
  release:
    needs: [version, ci, check]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # Only for the attestations: a token to sign them with (OIDC), and the right to store them.
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      # The archives the check job checked, and nothing else.
      - name: Check the checksums
        run: |
          sha256sum -c SHA256SUMS
          if [ "$(ls taskman-*.tar.gz | sort)" != "$(awk '{print $2}' SHA256SUMS | sort)" ]; then
            echo "The archives aren't the ones SHA256SUMS lists." >&2
            exit 1
          fi

      # Before anything is attested. The version job skips a released tag; this is in case one
      # was released by hand while the builds ran.
      - name: Check the tag has no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/releases"
          if gh api "$api/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG already has a release; delete it first to build it again." >&2
            exit 1
          fi
          # Creating a release for a missing tag would tag the default branch instead.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent; then
            echo "$TAG isn't a tag of $GITHUB_REPOSITORY." >&2
            exit 1
          fi
          # A run that failed part-way may have left a draft; the one published must be this run's.
          for id in $(gh api "$api?per_page=100" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "$api/$id"
          done

      # Signed statements that this workflow built each file from the tag, kept by GitHub, so
      # `gh attestation verify` can tell a release's files from ones built anywhere else.
      # Attestations need a public repository on the plan this one is on (a private one needs
      # GitHub Enterprise Cloud), so a release from a private repository goes out without them.
      - name: Attest
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            taskman-*.tar.gz
            SHA256SUMS

      # The notes are the version's section of CHANGELOG.md at the tag ("## 1.2.3 - 2026-10-12" up
      # to the next heading), read through the API so this job still runs no project code. A tag
      # from before the changelog gets notes generated from its commits.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$TAG" \
            -H 'Accept: application/vnd.github.raw' > CHANGELOG.md || : > CHANGELOG.md
          awk -v v="${TAG#v}" '/^## / { if (p) exit; p = ($2 == v); next } p' CHANGELOG.md | tee notes.md

      # A draft first, published once every file is on it: the install script, `taskman update`
      # and an immutable release only ever see a complete one. Nobody but the repository's writers
      # sees a draft, and releases/latest skips it. The draft is created through the API and then
      # used by its id: a list of releases can lag a create by a while, so the new draft isn't
      # looked for in one (nor by `gh release upload`, which lists releases to find a draft).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/releases"
          if grep -q '[^[:space:]]' notes.md; then
            jq -n --arg tag "$TAG" --rawfile body notes.md \
              '{tag_name: $tag, name: "taskman \($tag)", body: $body, draft: true}'
          else
            jq -n --arg tag "$TAG" \
              '{tag_name: $tag, name: "taskman \($tag)", generate_release_notes: true, draft: true}'
          fi > release.json
          created="$(gh api -X POST "$api" --input release.json --jq '"\(.id) \(.upload_url)"')"
          read -r id upload <<<"$created" || :
          if ! [[ "$id" =~ ^[0-9]+$ ]] || [ -z "$upload" ]; then
            echo "Creating the draft for $TAG returned no id: $created" >&2
            exit 1
          fi
          echo "Created draft $id for $TAG"
          # upload_url is a URL template ending in {?name,label}.
          upload="${upload%%\{*}"
          for f in taskman-*.tar.gz SHA256SUMS; do
            curl --fail-with-body --silent --show-error --retry 3 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" --data-binary "@$f" \
              "$upload?name=$f" >/dev/null
            echo "Uploaded $f"
          done

          want="$(printf '%s\n' taskman-*.tar.gz SHA256SUMS | sort)"
          got="$(gh api "$api/$id" --jq '.assets[] | select(.state == "uploaded") | .name' | sort)"
          if [ "$got" != "$want" ]; then
            printf 'The draft is missing files.\nWanted:\n%s\nGot:\n%s\n' "$want" "$got" >&2
            exit 1
          fi
          gh api -X PATCH "$api/$id" -F draft=false --jq '"Published " + .html_url'
