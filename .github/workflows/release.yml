# Builds taskman for each platform and publishes a GitHub Release with the binaries (each archive
# holding the binary and its license files), one SHA256SUMS, and the version's section of
# CHANGELOG.md as its notes. On a public repository it also attests where each file was built
# (`gh attestation verify`).
#
# Runs when a version tag (v1.2.3) is pushed. It can also be started by hand for a tag without a
# release, to build one again after deleting it:  gh workflow run release.yml -f tag=v1.2.3
#
# The build jobs run every dependency's build script, so they get a read-only token that isn't
# kept in .git/config; only the release job, which runs no project code, can write or attest.
# Actions are pinned by commit; Dependabot proposes updates (.github/dependabot.yml).
name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and release, like v1.2.3"
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # The tag being released: the one pushed, or the one given when started by hand.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          # Linux and WSL. The older Ubuntu keeps the glibc requirement low.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    # A build takes about two minutes; generous, as a release waits on the slowest.
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check the tag is a version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG isn't a version tag like v1.2.3" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Check the tag matches Cargo.toml
        run: |
          version="v$(cargo pkgid | sed 's/.*[#@]//')"
          if [ "$version" != "$TAG" ]; then
            echo "Tag $TAG doesn't match Cargo.toml's $version" >&2
            exit 1
          fi

      - run: rustup target add "$TARGET"

      - run: cargo build --release --locked --target "$TARGET"

      # LICENSE-THIRD-PARTY, the notices of the crates in the binary, goes in the archive and is
      # embedded in the binary, so it must be the committed file: generated again here from the
      # lockfile at the tag, with the cargo-about version CI checks it with, and compared.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2
      - name: Check the third-party notices are current
        run: |
          cargo about generate --locked --fail about.hbs -o notices.txt
          if ! diff LICENSE-THIRD-PARTY notices.txt; then
            echo "LICENSE-THIRD-PARTY is out of date at $TAG: regenerate it (see about.toml) and release again" >&2
            exit 1
          fi

      # The binary and its license files, flat, so the binary unpacks straight into a bin
      # directory: the install script and `taskman update` take only `taskman` out of the archive.
      - name: Package
        run: |
          cp LICENSE-MIT LICENSE-APACHE LICENSE-THIRD-PARTY "target/$TARGET/release/"
          tar czf "taskman-$TAG-$TARGET.tar.gz" -C "target/$TARGET/release" \
            taskman LICENSE-MIT LICENSE-APACHE LICENSE-THIRD-PARTY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: taskman-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # Only for the attestations: a token to sign them with (OIDC), and the right to store them.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      # Every archive carries the binary and its license files; a release without the notices
      # would be missing what the licenses of the code in it ask for.
      - name: Check the archives
        run: |
          for archive in taskman-*.tar.gz; do
            for f in taskman LICENSE-MIT LICENSE-APACHE LICENSE-THIRD-PARTY; do
              if ! tar tzf "$archive" | grep -qx "$f"; then
                echo "$archive doesn't hold $f" >&2
                exit 1
              fi
            done
          done

      # One file for every archive: the install script and `taskman update` refuse a download
      # it doesn't list.
      - name: Checksums
        run: sha256sum taskman-*.tar.gz | tee SHA256SUMS

      # Signed statements that this workflow built each file from the tag, kept by GitHub, so
      # `gh attestation verify` can tell a release's files from ones built anywhere else.
      # Attestations need a public repository on the plan this one is on (a private one needs
      # GitHub Enterprise Cloud), so a release from a private repository goes out without them.
      - name: Attest
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            taskman-*.tar.gz
            SHA256SUMS

      # The notes are the version's section of CHANGELOG.md at the tag ("## 1.2.3 - 2026-10-12" up
      # to the next heading), read through the API so this job still runs no project code. A tag
      # from before the changelog gets notes generated from its commits.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$TAG" \
            -H 'Accept: application/vnd.github.raw' > CHANGELOG.md || : > CHANGELOG.md
          awk -v v="${TAG#v}" '/^## / { if (p) exit; p = ($2 == v); next } p' CHANGELOG.md | tee notes.md

      # A draft first, published once every file is on it: the install script, `taskman update`
      # and an immutable release only ever see a complete one. Nobody but the repository's writers
      # sees a draft, and releases/latest skips it. The draft is created through the API and then
      # used by its id: a list of releases can lag a create by a while, so the new draft isn't
      # looked for in one (nor by `gh release upload`, which lists releases to find a draft).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/releases"
          if gh api "$api/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG already has a release; delete it first to build it again." >&2
            exit 1
          fi
          # Creating a release for a missing tag would tag the default branch instead.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent; then
            echo "$TAG isn't a tag of $GITHUB_REPOSITORY." >&2
            exit 1
          fi
          # A run that failed part-way may have left a draft; the one published must be this run's.
          for id in $(gh api "$api?per_page=100" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "$api/$id"
          done

          if grep -q '[^[:space:]]' notes.md; then
            jq -n --arg tag "$TAG" --rawfile body notes.md \
              '{tag_name: $tag, name: "taskman \($tag)", body: $body, draft: true}'
          else
            jq -n --arg tag "$TAG" \
              '{tag_name: $tag, name: "taskman \($tag)", generate_release_notes: true, draft: true}'
          fi > release.json
          created="$(gh api -X POST "$api" --input release.json --jq '"\(.id) \(.upload_url)"')"
          read -r id upload <<<"$created" || :
          if ! [[ "$id" =~ ^[0-9]+$ ]] || [ -z "$upload" ]; then
            echo "Creating the draft for $TAG returned no id: $created" >&2
            exit 1
          fi
          echo "Created draft $id for $TAG"
          # upload_url is a URL template ending in {?name,label}.
          upload="${upload%%\{*}"
          for f in taskman-*.tar.gz SHA256SUMS; do
            curl --fail-with-body --silent --show-error --retry 3 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" --data-binary "@$f" \
              "$upload?name=$f" >/dev/null
            echo "Uploaded $f"
          done

          want="$(printf '%s\n' taskman-*.tar.gz SHA256SUMS | sort)"
          got="$(gh api "$api/$id" --jq '.assets[] | select(.state == "uploaded") | .name' | sort)"
          if [ "$got" != "$want" ]; then
            printf 'The draft is missing files.\nWanted:\n%s\nGot:\n%s\n' "$want" "$got" >&2
            exit 1
          fi
          gh api -X PATCH "$api/$id" -F draft=false --jq '"Published " + .html_url'
